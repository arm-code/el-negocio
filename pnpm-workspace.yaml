# Solo el toolbox y los paquetes compartidos. apps/os y apps/api se instalan por
# separado: cada una tiene su propio pnpm-workspace.yaml y su lockfile.
packages:
  - apps/toolbox
  - packages/*

# Versiones que la app y los paquetes deben compartir: dos copias de React, Next o
# react-query rompen el contexto entre la app y los paquetes.
catalog:
  next: 16.1.6
  react: 19.2.3
  react-dom: 19.2.3
  '@types/react': ^19
  '@types/react-dom': ^19
  '@tanstack/react-query': ^5.104.1
  sonner: ^2.0.7
  lucide-react: ^0.563.0
  typescript: ^5
