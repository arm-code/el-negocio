# Las dos apps web y los paquetes compartidos. apps/api se instala por separado:
# tiene su propio pnpm-workspace.yaml y su lockfile.
packages:
  - apps/os
  - apps/toolbox
  - packages/*

# Versiones que las apps y los paquetes deben compartir: dos copias de React, Next o
# react-query rompen el contexto entre la app y los paquetes.
catalog:
  next: 16.2.4
  react: 19.2.5
  react-dom: 19.2.5
  '@types/react': ^19
  '@types/react-dom': ^19
  '@tanstack/react-query': ^5.104.1
  sonner: ^2.0.7
  lucide-react: ^0.563.0
  typescript: ^5
